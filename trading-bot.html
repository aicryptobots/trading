<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Auto Trading Bot | AI Signal + Confidence Score | $500 Trades</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0c12;
            color: #e0e0e0;
            padding: 20px;
        }
        .bot-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #0f111a;
            border-radius: 28px;
            border: 1px solid #2a2f3f;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 1.6rem;
            margin-bottom: 16px;
            color: #3b82f6;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .signal-box {
            background: #1a1f2a;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: center;
            border: 1px solid #2a3040;
        }
        .signal-label {
            font-size: 0.85rem;
            color: #8a8f9f;
            letter-spacing: 1px;
        }
        .signal-value {
            font-size: 2.2rem;
            font-weight: bold;
        }
        .signal-value.buy { color: #22c55e; }
        .signal-value.sell { color: #ef4444; }
        .signal-value.neutral { color: #f59e0b; }
        .confidence {
            font-size: 1rem;
            margin-top: 8px;
            color: #94a3b8;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #1a1f2a;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            transition: 0.2s;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #8a8f9f;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 6px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
            justify-content: space-between;
        }
        button, select {
            background: #1e2436;
            border: 1px solid #3b82f6;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 500;
        }
        button:hover {
            background: #3b82f6;
            transform: translateY(-1px);
        }
        .trade-btn.buy { background: #22c55e; border-color: #22c55e; }
        .trade-btn.sell { background: #ef4444; border-color: #ef4444; }
        .status {
            background: #1a1f2a;
            padding: 12px;
            border-radius: 14px;
            font-family: monospace;
            font-size: 0.85rem;
            margin: 20px 0;
            text-align: center;
        }
        .position-item {
            border-left: 4px solid;
            padding: 12px;
            margin: 10px 0;
            background: #0f111a;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .position-details { flex: 2; }
        .position-pnl { font-weight: bold; font-size: 1rem; }
        .profit { color: #22c55e; }
        .loss { color: #ef4444; }
        .close-btn {
            background: #ef4444;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0f111a;
            border-radius: 24px;
            width: 90%;
            max-width: 950px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #3b82f6;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid #2a2f3f;
            background: #1a1f2a;
        }
        .modal-header h3 {
            color: #3b82f6;
            font-size: 1.4rem;
        }
        .modal-close {
            background: #ef4444;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .history-table th, .history-table td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #2a2f3f;
        }
        .history-table th {
            color: #8a8f9f;
            font-weight: 600;
            background: #1a1f2a;
            position: sticky;
            top: 0;
        }
        .history-table tr:hover {
            background: #1a1f2a;
        }
        .profit-text { color: #22c55e; font-weight: bold; }
        .loss-text { color: #ef4444; font-weight: bold; }
        @media (max-width: 700px) {
            .stats-grid { grid-template-columns: repeat(2,1fr); }
            .controls { flex-direction: column; align-items: stretch; }
            button, select { width: 100%; }
            .history-table th, .history-table td { padding: 8px 4px; font-size: 0.75rem; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
</head>
<body>
<div class="bot-container">
    <h2>🤖 Auto Trading Bot</h2>
    <div class="signal-box">
        <div class="signal-label">AI RECOMMENDATION SIGNAL</div>
        <div class="signal-value" id="finalSignalDisplay">--</div>
        <div class="confidence" id="confidenceDisplay">Confidence: --%</div>
        <div class="signal-label" style="margin-top:12px;">RSI (14)</div>
        <div class="signal-value" id="rsiDisplay">--</div>
        <div class="signal-label">Current Price</div>
        <div class="signal-value" id="priceDisplay">--</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Balance</div><div class="stat-value" id="balance">10000</div></div>
        <div class="stat-card"><div class="stat-label">Total Trades</div><div class="stat-value" id="totalTrades">0</div></div>
        <div class="stat-card"><div class="stat-label">Win Rate</div><div class="stat-value" id="winRate">0%</div></div>
        <div class="stat-card"><div class="stat-label">Total Profit</div><div class="stat-value" id="totalProfit">$0</div></div>
    </div>

    <div class="controls">
        <select id="timeframeSelect">
            <option value="1m">1 minute</option>
            <option value="5m" selected>5 minutes</option>
            <option value="15m">15 minutes</option>
            <option value="1h">1 hour</option>
            <option value="4h">4 hours</option>
            <option value="1D">1 day</option>
        </select>
        <button id="startStopBtn">🤖 Start Auto Trading</button>
        <button class="trade-btn buy" id="testBuyBtn">🔵 Test BUY ($500)</button>
        <button class="trade-btn sell" id="testSellBtn">🔴 Test SELL ($500)</button>
        <button id="audioToggleBtn">🔊 Audio ON</button>
        <button id="historyBtn" class="history-btn">📜 Trade History</button>
    </div>

    <div class="status" id="statusMsg">⏸️ Auto trading OFF</div>

    <h3>📊 Open Positions (Real-time P&L)</h3>
    <div id="positionsList">No open positions</div>
</div>

<script>
    // ==================== DATA & STATE ====================
    let currentUser = "demo_user";
    let usersData = JSON.parse(localStorage.getItem('standalone_trading_data')) || {
        demo_user: {
            tradingData: {
                balance: 10000,
                totalTrades: 0,
                winTrades: 0,
                totalProfit: 0,
                positions: [],
                tradeHistory: []
            }
        }
    };
    let currentPrice = 67000;
    let selectedTF = "5m";
    let autoEnabled = false;
    let autoInterval = null;
    let lastTradeTime = 0;
    const COOLDOWN_MS = 60000;
    let audioEnabled = localStorage.getItem('audioAlertsEnabled') === 'true';
    const TRADE_AMOUNT = 500;
    const LEVERAGE = 5;

    // DOM elements
    const balanceSpan = document.getElementById('balance');
    const totalTradesSpan = document.getElementById('totalTrades');
    const winRateSpan = document.getElementById('winRate');
    const totalProfitSpan = document.getElementById('totalProfit');
    const positionsDiv = document.getElementById('positionsList');
    const statusMsgDiv = document.getElementById('statusMsg');
    const finalSignalSpan = document.getElementById('finalSignalDisplay');
    const confidenceSpan = document.getElementById('confidenceDisplay');
    const rsiSpan = document.getElementById('rsiDisplay');
    const priceDisplaySpan = document.getElementById('priceDisplay');

    function saveData() {
        localStorage.setItem('standalone_trading_data', JSON.stringify(usersData));
    }

    function updateStatsUI() {
        const data = usersData[currentUser].tradingData;
        balanceSpan.innerText = data.balance.toFixed(2);
        totalTradesSpan.innerText = data.totalTrades;
        const winRate = data.totalTrades > 0 ? (data.winTrades / data.totalTrades * 100).toFixed(1) : 0;
        winRateSpan.innerText = winRate + '%';
        totalProfitSpan.innerText = (data.totalProfit >= 0 ? '+' : '') + data.totalProfit.toFixed(2);
        totalProfitSpan.style.color = data.totalProfit >= 0 ? '#22c55e' : '#ef4444';
    }

    function renderPositions(positions) {
        if (!positions || positions.length === 0) {
            positionsDiv.innerHTML = "No open positions";
            return;
        }
        positionsDiv.innerHTML = positions.map(p => {
            const priceDiff = p.type === 'buy' ? (currentPrice - p.entryPrice) : (p.entryPrice - currentPrice);
            const pnlPercentRaw = (priceDiff / p.entryPrice) * 100;
            const pnl = (pnlPercentRaw / 100) * p.positionSize;
            const pnlClass = pnl >= 0 ? 'profit' : 'loss';
            return `
                <div class="position-item" style="border-left-color: ${p.type === 'buy' ? '#22c55e' : '#ef4444'}">
                    <div class="position-details">
                        <strong>${p.type.toUpperCase()}</strong> | Entry: $${p.entryPrice.toFixed(2)} | Size: $${p.positionSize} (${LEVERAGE}X)
                    </div>
                    <div class="position-pnl ${pnlClass}">
                        P&L: $${pnl.toFixed(2)} (${pnlPercentRaw.toFixed(2)}%)
                    </div>
                    <button class="close-btn" onclick="window.closePosition(${p.id})">Close</button>
                </div>
            `;
        }).join('');
    }

    function loadUserData() {
        updateStatsUI();
        renderPositions(usersData[currentUser].tradingData.positions);
    }

    // ==================== TRADE FUNCTIONS ====================
    window.executeTrade = function(type, amount = TRADE_AMOUNT) {
        const userData = usersData[currentUser].tradingData;
        if (amount > userData.balance) { alert("Insufficient balance"); return false; }
        if (userData.positions && userData.positions.length > 0) { alert("Close existing position first"); return false; }
        const positionSize = amount * LEVERAGE;
        const position = {
            id: Date.now(),
            type: type,
            amount: amount,
            leverage: LEVERAGE,
            positionSize: positionSize,
            entryPrice: currentPrice,
            timestamp: new Date().toISOString()
        };
        userData.positions.push(position);
        userData.balance -= amount;
        userData.totalTrades++;
        saveData();
        loadUserData();
        speakMessage(type === 'buy' ? "Right time open buy trade" : "Right time open sell trade");
        showStatus(`${type.toUpperCase()} trade placed: $${amount} @ $${currentPrice.toFixed(2)} (${LEVERAGE}X)`, 'success');
        return true;
    };

    window.closePosition = function(id) {
        const userData = usersData[currentUser].tradingData;
        const idx = userData.positions.findIndex(p => p.id == id);
        if (idx === -1) return;
        const pos = userData.positions[idx];
        const priceDiff = pos.type === 'buy' ? (currentPrice - pos.entryPrice) : (pos.entryPrice - currentPrice);
        const pnlPercentRaw = (priceDiff / pos.entryPrice) * 100;
        const pnl = (pnlPercentRaw / 100) * pos.positionSize;
        userData.balance += pos.amount + pnl;
        if (pnl > 0) userData.winTrades++;
        userData.totalProfit += pnl;
        if (!userData.tradeHistory) userData.tradeHistory = [];
        userData.tradeHistory.unshift({
            date: new Date().toLocaleString(),
            type: pos.type,
            entryPrice: pos.entryPrice,
            exitPrice: currentPrice,
            pnl: pnl,
            pnlPercent: pnlPercentRaw
        });
        if (userData.tradeHistory.length > 100) userData.tradeHistory.pop();
        userData.positions.splice(idx, 1);
        saveData();
        loadUserData();
        speakMessage("Right time close trade");
        showStatus(`Closed ${pos.type} | PnL: $${pnl.toFixed(2)} (${pnlPercentRaw.toFixed(2)}%)`, pnl >= 0 ? 'success' : 'error');
    };

    // ==================== MARKET DATA ====================
    async function fetchCandles(symbol = "BTCUSDT", interval = "5m", limit = 50) {
        const directUrl = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
        const proxyUrl = `https://cors-anywhere.herokuapp.com/${directUrl}`;
        try {
            let response = await axios.get(directUrl, { timeout: 8000 });
            return response.data.map(k => ({
                time: k[0],
                open: parseFloat(k[1]),
                high: parseFloat(k[2]),
                low: parseFloat(k[3]),
                close: parseFloat(k[4]),
                volume: parseFloat(k[5])
            }));
        } catch (e) {
            try {
                let response = await axios.get(proxyUrl, { timeout: 10000 });
                return response.data.map(k => ({
                    time: k[0],
                    open: parseFloat(k[1]),
                    high: parseFloat(k[2]),
                    low: parseFloat(k[3]),
                    close: parseFloat(k[4]),
                    volume: parseFloat(k[5])
                }));
            } catch (e2) {
                // Demo data fallback
                let demo = [];
                let price = currentPrice || 67000;
                for (let i=0; i<limit; i++) {
                    let change = (Math.random() - 0.5) * price * 0.005;
                    price += change;
                    demo.push({
                        time: Date.now() - (limit-i)*300000,
                        open: price - price*0.001,
                        high: price + price*0.002,
                        low: price - price*0.002,
                        close: price,
                        volume: Math.random() * 1000
                    });
                }
                return demo;
            }
        }
    }

    function calculateRSI(closes, period = 14) {
        if (closes.length < period + 1) return 50;
        let gains = 0, losses = 0;
        for (let i = closes.length - period; i < closes.length; i++) {
            const diff = closes[i] - closes[i-1];
            if (diff >= 0) gains += diff;
            else losses -= diff;
        }
        const avgGain = gains / period;
        const avgLoss = losses / period;
        if (avgLoss === 0) return 100;
        const rs = avgGain / avgLoss;
        return 100 - (100 / (1 + rs));
    }

    function calculateSupportResistance(candles) {
        const highs = candles.map(c => c.high);
        const lows = candles.map(c => c.low);
        const support = Math.min(...lows.slice(-20));
        const resistance = Math.max(...highs.slice(-20));
        return { support, resistance };
    }

    // ========== IMPROVED SIGNAL & CONFIDENCE (always shows a percentage) ==========
    function computeSignalAndConfidence(rsi, price, support, resistance) {
        const nearSupport = price <= support * 1.005;
        const nearResistance = price >= resistance * 0.995;
        let signal = "NEUTRAL";
        let confidence = 0;
        
        // Distance to key levels
        const rsiDistanceToBuy = Math.max(0, 30 - rsi);      // how far below 30
        const rsiDistanceToSell = Math.max(0, rsi - 70);     // how far above 70
        const supportDistance = nearSupport ? Math.max(0, (support - price) / support) : 0;
        const resistanceDistance = nearResistance ? Math.max(0, (price - resistance) / resistance) : 0;
        
        if (rsi < 30 && nearSupport) {
            signal = "BUY";
            // Base 50% + rsiDistance (max 20) + support proximity (max 30)
            let base = 50 + Math.min(20, rsiDistanceToBuy * 2) + Math.min(30, (30 - rsi) * 1.5);
            confidence = Math.min(99, Math.max(30, base));
        } 
        else if (rsi > 70 && nearResistance) {
            signal = "SELL";
            let base = 50 + Math.min(20, rsiDistanceToSell * 2) + Math.min(30, (rsi - 70) * 1.5);
            confidence = Math.min(99, Math.max(30, base));
        }
        else if (rsi < 35) {
            signal = "BUY (weak)";
            let base = 30 + (35 - rsi) * 2;
            confidence = Math.min(70, Math.max(20, base));
        }
        else if (rsi > 65) {
            signal = "SELL (weak)";
            let base = 30 + (rsi - 65) * 2;
            confidence = Math.min(70, Math.max(20, base));
        }
        else {
            signal = "NEUTRAL";
            // Confidence based on distance from 50 (more extreme = higher confidence in neutrality?)
            let distanceFrom50 = Math.abs(rsi - 50);
            let base = Math.min(50, distanceFrom50 * 1.5);
            confidence = Math.max(5, Math.min(50, base));
        }
        
        // Ensure confidence is integer and between 0-100
        confidence = Math.round(confidence);
        return { signal: signal.toUpperCase(), confidence };
    }

    async function updateMarketAndSignal() {
        const candles = await fetchCandles("BTCUSDT", selectedTF, 50);
        if (!candles || candles.length === 0) return;
        currentPrice = candles[candles.length-1].close;
        priceDisplaySpan.innerText = `$${currentPrice.toFixed(2)}`;
        const closes = candles.map(c => c.close);
        const rsi = calculateRSI(closes, 14);
        const { support, resistance } = calculateSupportResistance(candles);
        const { signal, confidence } = computeSignalAndConfidence(rsi, currentPrice, support, resistance);
        
        // Display signal and confidence
        finalSignalSpan.innerText = signal === "BUY (WEAK)" ? "BUY" : signal === "SELL (WEAK)" ? "SELL" : signal;
        finalSignalSpan.className = `signal-value ${signal.toLowerCase().includes('buy') ? 'buy' : signal.toLowerCase().includes('sell') ? 'sell' : 'neutral'}`;
        confidenceSpan.innerText = `Confidence: ${confidence}%`;
        rsiSpan.innerText = rsi.toFixed(2);
        
        renderPositions(usersData[currentUser].tradingData.positions);
        return { signal, confidence, rsi, price: currentPrice, support, resistance };
    }

    // ==================== AUTO TRADING ====================
    async function checkAndTrade() {
        if (!autoEnabled) return;
        const userData = usersData[currentUser].tradingData;
        if (userData.positions && userData.positions.length > 0) {
            showStatus("📌 Open position exists - waiting", 'info');
            return;
        }
        const data = await updateMarketAndSignal();
        if (!data) return;
        const { signal, confidence, rsi, price } = data;
        const now = Date.now();
        if (now - lastTradeTime < COOLDOWN_MS) {
            showStatus(`Cooldown: ${Math.ceil((COOLDOWN_MS - (now - lastTradeTime))/1000)}s left`, 'info');
            return;
        }
        let action = null;
        if ((signal === "BUY" || signal === "BUY (WEAK)") && confidence >= 40) action = "buy";
        else if ((signal === "SELL" || signal === "SELL (WEAK)") && confidence >= 40) action = "sell";
        if (action) {
            const success = window.executeTrade(action, TRADE_AMOUNT);
            if (success) {
                lastTradeTime = now;
                showStatus(`✅ Auto ${action.toUpperCase()} executed at $${price.toFixed(2)} (Conf: ${confidence}%)`, 'success');
            }
        } else {
            showStatus(`No signal: ${signal} | RSI=${rsi.toFixed(1)}`, 'info');
        }
    }

    // ==================== TP/SL AUTO CLOSE ====================
    function getTPSLByTimeframe(tf) {
        switch(tf) {
            case '1m': return { tpPercent: 0.0025, slPercent: 0.0012 };
            case '5m': return { tpPercent: 0.006, slPercent: 0.003 };
            case '15m': return { tpPercent: 0.009, slPercent: 0.0045 };
            case '1h': return { tpPercent: 0.0135, slPercent: 0.00675 };
            case '4h': return { tpPercent: 0.02, slPercent: 0.01 };
            case '1D': return { tpPercent: 0.035, slPercent: 0.0175 };
            default: return { tpPercent: 0.006, slPercent: 0.003 };
        }
    }

    async function autoClosePositions() {
        const userData = usersData[currentUser].tradingData;
        if (!userData.positions.length) return;
        const candles = await fetchCandles("BTCUSDT", selectedTF, 1);
        if (!candles) return;
        const current = candles[0].close;
        const { tpPercent, slPercent } = getTPSLByTimeframe(selectedTF);
        let updated = false;
        for (let i=0; i<userData.positions.length; i++) {
            const pos = userData.positions[i];
            const pnlPercentRaw = pos.type === 'buy' ? (current - pos.entryPrice)/pos.entryPrice : (pos.entryPrice - current)/pos.entryPrice;
            if (pnlPercentRaw >= tpPercent || pnlPercentRaw <= -slPercent) {
                const pnl = pnlPercentRaw * pos.positionSize;
                userData.balance += pos.amount + pnl;
                if (pnl > 0) userData.winTrades++;
                userData.totalProfit += pnl;
                if (!userData.tradeHistory) userData.tradeHistory = [];
                userData.tradeHistory.unshift({
                    date: new Date().toLocaleString(),
                    type: pos.type,
                    entryPrice: pos.entryPrice,
                    exitPrice: current,
                    pnl: pnl,
                    pnlPercent: pnlPercentRaw * 100
                });
                if (userData.tradeHistory.length > 100) userData.tradeHistory.pop();
                userData.positions.splice(i,1);
                updated = true;
                i--;
                speakMessage("Right time close trade");
            }
        }
        if (updated) {
            saveData();
            loadUserData();
        }
    }

    // ==================== TRADE HISTORY MODAL ====================
    function showTradeHistoryModal() {
        const history = usersData[currentUser].tradingData.tradeHistory || [];
        if (history.length === 0) {
            alert("No trade history yet.");
            return;
        }
        const modalOverlay = document.createElement('div');
        modalOverlay.className = 'modal-overlay';
        let rows = '';
        history.forEach(t => {
            const pnlClass = t.pnl >= 0 ? 'profit-text' : 'loss-text';
            rows += `
                <tr>
                    <td>${t.date}</td>
                    <td style="text-transform:uppercase; color:${t.type === 'buy' ? '#22c55e' : '#ef4444'}">${t.type}</td>
                    <td>$${t.entryPrice.toFixed(2)}</td>
                    <td>$${t.exitPrice.toFixed(2)}</td>
                    <td class="${pnlClass}">$${t.pnl.toFixed(2)} (${t.pnlPercent.toFixed(1)}%)</td>
                </tr>
            `;
        });
        modalOverlay.innerHTML = `
            <div class="modal-content">
                <div class="modal-header">
                    <h3>📜 Trade History</h3>
                    <button class="modal-close">Close</button>
                </div>
                <div class="modal-body">
                    <table class="history-table">
                        <thead>
                            <tr><th>Date & Time</th><th>Type</th><th>Entry Price</th><th>Exit Price</th><th>P&L</th></tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
        document.body.appendChild(modalOverlay);
        modalOverlay.querySelector('.modal-close').onclick = () => modalOverlay.remove();
        modalOverlay.onclick = (e) => { if (e.target === modalOverlay) modalOverlay.remove(); };
    }

    // ==================== UI CONTROLS ====================
    document.getElementById('startStopBtn').onclick = () => {
        autoEnabled = !autoEnabled;
        const btn = document.getElementById('startStopBtn');
        btn.innerText = autoEnabled ? "⏸️ Stop Auto Trading" : "🤖 Start Auto Trading";
        if (autoEnabled) {
            if (autoInterval) clearInterval(autoInterval);
            autoInterval = setInterval(checkAndTrade, 10000);
            checkAndTrade();
            showStatus("✅ Auto trading ENABLED", 'success');
        } else {
            if (autoInterval) clearInterval(autoInterval);
            autoInterval = null;
            showStatus("⏹️ Auto trading DISABLED", 'info');
        }
    };
    document.getElementById('testBuyBtn').onclick = () => window.executeTrade('buy', TRADE_AMOUNT);
    document.getElementById('testSellBtn').onclick = () => window.executeTrade('sell', TRADE_AMOUNT);
    document.getElementById('timeframeSelect').onchange = (e) => { selectedTF = e.target.value; localStorage.setItem('selectedTF', selectedTF); updateMarketAndSignal(); };
    document.getElementById('audioToggleBtn').onclick = () => {
        audioEnabled = !audioEnabled;
        localStorage.setItem('audioAlertsEnabled', audioEnabled);
        document.getElementById('audioToggleBtn').innerText = audioEnabled ? "🔊 Audio ON" : "🔇 Audio OFF";
    };
    document.getElementById('historyBtn').onclick = showTradeHistoryModal;

    function speakMessage(msg) {
        if (!audioEnabled) return;
        let count = 0;
        function speak() {
            if (!audioEnabled) return;
            const utterance = new SpeechSynthesisUtterance(msg);
            utterance.rate = 0.7;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
            count++;
            if (count < 5) setTimeout(speak, 1800);
        }
        speak();
    }

    function showStatus(msg, type = 'info') {
        statusMsgDiv.innerHTML = msg;
        statusMsgDiv.style.color = type === 'success' ? '#22c55e' : (type === 'error' ? '#ef4444' : '#f59e0b');
        setTimeout(() => { if (statusMsgDiv.innerHTML === msg) statusMsgDiv.style.color = '#e0e0e0'; }, 4000);
    }

    // ==================== INITIALIZATION ====================
    loadUserData();
    updateMarketAndSignal();
    const savedTF = localStorage.getItem('selectedTF');
    if (savedTF) { selectedTF = savedTF; document.getElementById('timeframeSelect').value = selectedTF; }
    audioEnabled = localStorage.getItem('audioAlertsEnabled') === 'true';
    document.getElementById('audioToggleBtn').innerText = audioEnabled ? "🔊 Audio ON" : "🔇 Audio OFF";

    setInterval(async () => {
        await updateMarketAndSignal();
        await autoClosePositions();
    }, 10000);
</script>
</body>
</html>
